  --orange: #f47745;
  --line: rgba(227,239,213,.15);
  --max: 1180px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 90px; }
body {
  margin: 0; color: var(--ink); background: var(--bg);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.55; -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input { font: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, video:focus-visible {
  outline: 3px solid var(--sky); outline-offset: 4px;
}
button { cursor: pointer; }
.skip-link { position: absolute; z-index: 20; top: 9px; left: 9px; padding: 10px 14px; color: var(--bg); background: var(--ink); transform: translateY(-160%); }
.skip-link:focus { transform: translateY(0); }
.noscript { padding: 20px; }
.section-wrap { width: min(calc(100% - 48px), var(--max)); margin-inline: auto; }
.brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 850; letter-spacing: -.045em; white-space: nowrap; }
.brand-large { font-size: 19px; }
.brand-accent { color: var(--green); }
.brand-mark { width: 25px; height: 25px; display: grid; grid-template: repeat(2,1fr)/repeat(2,1fr); gap: 2px; transform: rotate(-8deg); }
.brand-mark i { background: var(--green); }
.brand-mark i:nth-child(2) { background: var(--orange); }
.brand-mark i:nth-child(3) { grid-column: 2; background: var(--sky); }
.eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
.eyebrow-dot { width: 7px; height: 7px; background: var(--green); box-shadow: 0 0 14px rgba(165,230,92,.5); }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 20px; font-size: clamp(42px,6vw,72px); line-height: .99; letter-spacing: -.075em; font-weight: 830; }
h1 span { color: var(--green); }
h2 { font-size: clamp(30px,4vw,47px); line-height: 1.08; letter-spacing: -.06em; }
h3 { letter-spacing: -.04em; }
.button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 15px; padding: 0 19px; border: 0; text-decoration: none; font-size: 13px; font-weight: 800; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.button-primary { color: #14200e; background: var(--green); box-shadow: 4px 4px 0 #527735; }
.button-primary:hover { background: #b8f078; transform: translate(2px,2px); box-shadow: 2px 2px 0 #527735; }
.button-secondary { color: var(--ink); background: transparent; border: 1px solid var(--line); }
.button-secondary:hover { color: var(--green); border-color: var(--green); }
.text-link, .dark-link { font-size: 13px; font-weight: 750; text-underline-offset: 5px; }
.text-link { color: var(--ink); text-decoration-color: rgba(245,243,232,.4); }
.text-link span, .dark-link span { margin-left: 7px; color: var(--green); }
.dark-link { color: #1b2917; }
.dark-link span { color: #4e7c2c; }
.free-pill { display: inline-flex; align-items: center; padding: 4px 9px; color: #dbffc7; background: #254025; font-size: 10px; font-weight: 800; letter-spacing: .06em; }
.pixel-spark { color: var(--orange); font-size: 17px; }

/* Entrada */
.auth-page { min-height: 100svh; display: grid; grid-template-columns: 1.05fr .95fr; background: radial-gradient(ellipse at 20% 15%,rgba(95,139,56,.16),transparent 42%),var(--bg); }
.auth-story { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 100svh; padding: clamp(28px,5vw,70px); border-right: 1px solid var(--line); overflow: hidden; }
.auth-story::before { position: absolute; content: ""; width: 280px; height: 280px; top: 17%; right: -120px; border: 1px solid rgba(131,201,255,.15); transform: rotate(22deg); pointer-events: none; }
.auth-story-copy { position: relative; z-index: 1; max-width: 530px; margin: 36px 0 25px; }
.auth-story-copy h1 { font-size: clamp(52px,7vw,88px); }
.auth-story-copy > p:last-child { max-width: 430px; color: #c3cabe; }
.auth-art { position: relative; z-index: 1; max-width: 610px; margin: 0; }
.auth-art img { display: block; width: 100%; max-height: 290px; object-fit: cover; border: 1px solid rgba(255,255,255,.18); box-shadow: 12px 12px 0 rgba(165,230,92,.13); }
.auth-art figcaption { display: flex; align-items: center; gap: 12px; margin-top: 19px; color: var(--muted); font-size: 11px; }
.auth-art figcaption strong { color: var(--ink); }
.caption-square { display: grid; place-items: center; width: 34px; height: 34px; color: var(--bg); background: var(--green); font-weight: 900; }
.independent-note { color: var(--green); font-size: 11px; }
.auth-story > .independent-note { position: relative; z-index: 1; margin: 24px 0 0; }
.auth-side { display: grid; place-items: center; padding: 42px; }
.auth-card { width: min(100%,430px); }
.auth-card h2 { margin: 0 0 10px; font-size: 38px; }
.auth-description { margin-bottom: 27px; color: var(--muted); font-size: 13px; }
#auth-form { display: flex; flex-direction: column; }
#auth-form label { margin: 14px 0 7px; color: #dce5d8; font-size: 12px; font-weight: 700; }
#auth-form input { width: 100%; min-height: 48px; padding: 0 13px; color: var(--ink); border: 1px solid #475445; border-radius: 0; background: #121a13; }
#auth-form input::placeholder { color: #788675; }
#auth-form input:focus { border-color: var(--green); }
.auth-submit { width: 100%; margin-top: 22px; }
.mode-switch { align-self: center; margin-top: 18px; padding: 5px 0; color: var(--green); border: 0; background: transparent; font-size: 12px; font-weight: 750; }
.mode-switch:hover { text-decoration: underline; text-underline-offset: 4px; }
.form-error { margin: 12px 0 0; padding: 10px 12px; color: #ffe2d7; border-left: 3px solid var(--orange); background: rgba(244,119,69,.1); font-size: 12px; }
.demo-notice { margin-top: 29px; padding: 15px 16px; color: #d2dacd; border: 1px solid rgba(131,201,255,.25); background: rgba(131,201,255,.055); }
.demo-notice strong { color: var(--sky); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.demo-notice p { margin: 6px 0 0; color: #aebbaa; font-size: 11px; line-height: 1.65; }

/* Navegação e páginas com sessão */
.site-header { position: sticky; z-index: 10; top: 0; background: rgba(16,23,16,.95); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.nav-wrap { width: min(calc(100% - 48px),var(--max)); min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: auto; }
.main-nav, .footer-nav { display: flex; align-items: center; gap: clamp(17px,2.8vw,34px); }
.main-nav a, .footer-nav a { color: var(--muted); text-decoration: none; font-size: 12px; }
.main-nav a:hover, .main-nav a.active, .footer-nav a:hover { color: var(--green); }
.account-actions { display: flex; align-items: center; gap: 13px; }
.demo-chip { padding: 4px 7px; color: var(--sky); border: 1px solid rgba(131,201,255,.35); font-size: 9px; font-weight: 850; letter-spacing: .08em; }
.logout-button { padding: 8px 0 8px 8px; color: #c4cec0; border: 0; background: transparent; font-size: 11px; }
.logout-button:hover { color: var(--orange); }
.session-note { margin: 0; padding: 5px 20px 7px; color: #9aa696; background: #0c120d; text-align: center; font-size: 10px; }
.page-main { min-height: 50vh; }
.hero { min-height: 590px; display: grid; grid-template-columns: 1fr .9fr; align-items: center; gap: clamp(40px,7vw,88px); padding-block: 74px 89px; }
.hero-copy h1 { max-width: 650px; }
.hero-lead { max-width: 500px; margin-bottom: 26px; color: #c3cabe; font-size: 15px; line-height: 1.75; }
.hero-actions { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
.hero-note { margin-top: 38px; color: #899588; font-size: 11px; }
.featured-cover, .template-cover { min-width: 0; border: 1px solid var(--line); background: var(--surface); }
.cover-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; }
.cover-label { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .13em; }
.video-stage { position: relative; overflow: hidden; background: #050805; background-image: linear-gradient(135deg,rgba(165,230,92,.05) 25%,transparent 25%),linear-gradient(315deg,rgba(131,201,255,.04) 25%,transparent 25%); background-size: 24px 24px; }
.cover-video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: transparent; }
.play-indicator { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; color: white; background: rgba(5,9,5,.72); border: 1px solid rgba(255,255,255,.18); font-size: 10px; pointer-events: none; }
.play-indicator span { color: var(--green); font-size: 9px; }
.video-fallback { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 12px 16px; color: #15200f; border: 0; background: var(--green); font-size: 12px; font-weight: 850; box-shadow: 4px 4px 0 rgba(7,13,7,.8); }
.video-fallback[hidden] { display: none; }
.video-status { min-height: 30px; margin: 0; padding: 8px 12px; color: #aab5a6; background: #0d140e; font-size: 10px; }
.cover-meta { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px; }
.cover-meta > div { display: flex; align-items: center; gap: 11px; min-width: 0; }
.caption-index { display: grid; flex: 0 0 37px; place-items: center; width: 37px; height: 37px; color: #16200f; background: var(--green); font-size: 11px; font-weight: 900; }
.cover-meta strong, .cover-meta small { display: block; }
.cover-meta strong { font-size: 12px; }
.cover-meta small { margin-top: 3px; color: var(--muted); font-size: 10px; }
.cover-meta .text-link { white-space: nowrap; font-size: 11px; }
.sound-note { margin: 0; padding: 0 17px 14px; color: #9fb098; font-size: 10px; }
.library { padding-block: 68px 100px; border-top: 1px solid var(--line); }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 35px; margin-bottom: 28px; }
.section-heading h2 { margin: 0; }
.section-intro { max-width: 400px; margin: 0 0 3px; color: var(--muted); font-size: 13px; }
.recent-row { display: flex; align-items: center; justify-content: space-between; gap: 22px; padding: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.card-kicker { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
.recent-row h3 { margin: 0 0 5px; font-size: 21px; }
.recent-row p { margin: 0; color: var(--muted); font-size: 11px; }
.how-section { position: relative; overflow: hidden; color: #192318; background: #dcebc9; }
.how-section::before { position: absolute; inset: 0; content: ""; opacity: .16; background-image: linear-gradient(90deg,transparent 95%,#73835e 95%),linear-gradient(transparent 95%,#73835e 95%); background-size: 28px 28px; mask-image: linear-gradient(90deg,#000,transparent 62%); pointer-events: none; }
.how-inner { position: relative; display: grid; grid-template-columns: .82fr 1.18fr; gap: clamp(50px,9vw,130px); padding-block: 82px; }
.how-copy .eyebrow { color: #3f642a; }
.how-copy .eyebrow-dot { background: #4c762d; box-shadow: none; }
.how-copy h2 { margin: 0; }
.how-copy h2 span { color: #4e7c2c; }
.how-copy > p:not(.eyebrow) { max-width: 320px; margin: 17px 0; color: #51624a; font-size: 13px; }
.steps { margin: 0; padding: 0; list-style: none; border-top: 1px solid rgba(25,35,24,.22); }
.steps li { display: grid; grid-template-columns: 45px 1fr; gap: 13px; padding: 13px 0; border-bottom: 1px solid rgba(25,35,24,.22); }
.step-number { color: #577b34; font-size: 12px; font-weight: 900; }
.steps strong, .steps small { display: block; }
.steps strong { font-size: 13px; }
.steps small { margin-top: 2px; color: #55634f; font-size: 11px; }
.independent { display: flex; align-items: center; gap: 12px; padding-block: 25px; color: #b9c5b5; font-size: 11px; }
.independent p { margin: 0; }
.site-footer { border-top: 1px solid var(--line); background: #0b100c; }
.footer-main { display: flex; align-items: center; gap: 28px; min-height: 82px; }
.footer-brand { font-size: 15px; }
.footer-main > p { margin: 0; color: #7f8b7d; font-size: 10px; }
.footer-nav { margin-left: auto; }
.footer-bottom { display: flex; justify-content: space-between; gap: 12px; padding-block: 14px 20px; border-top: 1px solid var(--line); color: #899384; font-size: 10px; }

/* Biblioteca, detalhe e informação */
.subpage { padding-block: 64px 100px; }
.subpage > h1 { margin-bottom: 16px; }
.template-card { display: grid; grid-template-columns: minmax(0,1fr) minmax(310px,.82fr); border: 1px solid var(--line); background: var(--surface); }
.template-cover { border: 0; border-right: 1px solid var(--line); }
.card-content { align-self: center; padding: clamp(25px,4vw,48px); }
.card-content h2 { margin: 0 0 13px; font-size: clamp(25px,3vw,36px); }
.card-description { margin-bottom: 16px; color: #c0c9bc; font-size: 13px; line-height: 1.7; }
.card-content .sound-note { padding: 0; margin-bottom: 23px; }
.detail-page { padding-block: 38px 100px; }
.back-link { display: inline-block; margin-bottom: 26px; color: var(--muted); font-size: 12px; text-decoration-color: rgba(255,255,255,.3); text-underline-offset: 4px; }
.back-link:hover { color: var(--green); }
.detail-grid { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(300px,.95fr); align-items: start; gap: clamp(30px,5vw,65px); }
.detail-player { min-width: 0; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.detail-player .cover-heading { border-bottom: 1px solid var(--line); }
.detail-video { display: block; width: 100%; aspect-ratio: 16/9; background: #050805; object-fit: contain; }
.video-hint { margin: 0; padding: 10px 12px; color: var(--muted); border-top: 1px solid var(--line); font-size: 11px; }
.detail-copy { padding: 12px 0; }
.detail-copy h1 { font-size: clamp(34px,4vw,52px); }
.detail-copy .card-description { max-width: 540px; }
.download-button { margin: 5px 0 10px; }
.file-note { color: var(--muted); font-size: 10px; }
.spec-heading { margin: 28px 0 10px; font-size: 14px; letter-spacing: 0; }
.detail-specs { margin: 0; border-top: 1px solid var(--line); }
.detail-specs div { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
.detail-specs dt { color: var(--muted); }
.detail-specs dd { margin: 0; text-align: right; }
.steps-large { max-width: 780px; margin-top: 30px; border-color: var(--line); }
.steps-large li { grid-template-columns: 54px 1fr; padding-block: 18px; border-color: var(--line); }
.steps-large strong { color: var(--ink); font-size: 14px; }
.steps-large small { color: var(--muted); font-size: 12px; }
.info-page { min-height: 48vh; }
.info-page > p:not(.eyebrow) { max-width: 680px; color: #c0c9bc; font-size: 14px; }
.info-page .text-link { display: inline-block; margin-top: 20px; }
.about-image { display: block; width: min(100%,560px); height: auto; margin: 23px 0; border: 1px solid var(--line); }

@media (max-width: 900px) {
  .auth-page { grid-template-columns: .95fr 1.05fr; }
  .auth-story { padding: 38px; }
  .auth-side { padding: 32px; }
  .hero { grid-template-columns: 1fr; gap: 40px; padding-block: 60px 70px; }
  .hero-copy { max-width: 680px; }
  .featured-cover { width: min(100%,720px); justify-self: center; }
  .detail-grid { grid-template-columns: 1fr; }
  .detail-copy { padding-top: 0; }
}
@media (max-width: 680px) {
  .auth-page { grid-template-columns: 1fr; }
  .auth-story { min-height: auto; padding: 27px 24px 24px; border-right: 0; border-bottom: 1px solid var(--line); }
  .auth-story-copy { margin: 35px 0 20px; }
  .auth-story-copy h1 { font-size: clamp(49px,13vw,66px); }
  .auth-art { max-width: 450px; }
  .auth-art img { max-height: 190px; }
  .auth-story > .independent-note { margin-top: 18px; }
  .auth-side { padding: 35px 24px 48px; }
  .nav-wrap { width: min(calc(100% - 36px),var(--max)); min-height: 0; display: grid; grid-template-columns: 1fr auto; row-gap: 12px; padding-block: 13px; }
  .brand { font-size: 15px; }
  .brand-mark { width: 22px; height: 22px; }
  .account-actions { grid-column: 2; grid-row: 1; gap: 8px; }
  .demo-chip { font-size: 8px; }
  .logout-button { font-size: 10px; }
  .main-nav { grid-column: 1/-1; grid-row: 2; justify-content: space-between; gap: 10px; }
  .main-nav a { font-size: 11px; }
  .session-note { font-size: 9px; }
  .section-wrap { width: min(calc(100% - 36px),var(--max)); }
  .hero { min-height: auto; padding-block: 48px 60px; gap: 33px; }
  .hero h1 { font-size: clamp(42px,12vw,60px); }
  .hero-lead { font-size: 14px; }
  .cover-meta { align-items: flex-start; flex-wrap: wrap; }
  .cover-meta .text-link { margin-left: 48px; }
  .section-heading { display: block; }
  .section-intro { margin-top: 13px; }
  .library { padding-block: 55px 68px; }
  .recent-row { align-items: flex-start; flex-direction: column; }
  .how-inner { grid-template-columns: 1fr; gap: 27px; padding-block: 58px; }
  .how-copy h2 br { display: none; }
  .independent { align-items: flex-start; }
  .footer-main { align-items: flex-start; flex-wrap: wrap; gap: 15px 22px; padding-block: 22px; }
  .footer-main > p { width: 100%; order: 3; }
  .footer-nav { gap: 17px; margin-left: 0; }
  .footer-bottom { flex-direction: column; }
  .subpage { padding-block: 48px 72px; }
  .template-card { grid-template-columns: 1fr; }
  .template-cover { border-right: 0; border-bottom: 1px solid var(--line); }
  .card-content { padding: 24px 20px 28px; }
  .detail-page { padding-block: 27px 65px; }
  .detail-grid { gap: 25px; }
}
@media (max-width: 390px) {
  .demo-chip { display: none; }
  .account-actions { justify-content: flex-end; }
  .hero-actions { gap: 18px; }
  .play-indicator { top: 8px; left: 8px; padding: 5px 7px; font-size: 9px; }
  .video-fallback { width: max-content; max-width: 85%; }
}
@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}


/* Consentimento explícito para a sessão de demonstração lembrada */
.remember-setting {
  display: flex; align-items: flex-start; gap: 10px; margin: 17px 0 2px;
  padding: 12px; border: 1px solid var(--line); background: rgba(165,230,92,.045);
  cursor: pointer;
}
.remember-setting input { flex: 0 0 17px; width: 17px !important; min-height: 17px !important; margin: 2px 0 0; accent-color: var(--green); }
.remember-setting span, .remember-setting strong, .remember-setting small { display: block; }
.remember-setting strong { color: var(--ink); font-size: 11px; }
.remember-setting small { margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.4; }
.remembered-email { max-width: 190px; overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.cookie-state { padding: 12px 14px; border-left: 3px solid var(--green); background: rgba(165,230,92,.07); }
.demo-notice-text { max-width: 700px; color: var(--muted) !important; font-size: 12px !important; }
.cookie-page .button { margin-top: 10px; }
@media (max-width: 680px) {
  .remembered-email { max-width: 120px; }
}

  
.template-card + .template-card { margin-top: 18px; }
.recent-row + .recent-row { margin-top: 14px; }

/* Pixel heading and light interaction polish */
.auth-story-copy h1 {
  max-width: 100%;
  font-family: "Press Start 2P", monospace;
  font-size: clamp(18px, 2.45vw, 30px);
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: 0;
  text-shadow: 3px 3px 0 rgba(0,0,0,.58);
}
.auth-story-copy h1 span { color: var(--green); }
.auth-card, .auth-story-copy { animation: ccmc-fade-up .55s cubic-bezier(.2,.8,.2,1) both; }
.auth-card { animation-delay: .08s; }
.auth-art img { animation: ccmc-float 6s ease-in-out infinite; }
.auth-story::before { animation: ccmc-orbit 12s ease-in-out infinite; }
.pixel-spark { display: inline-block; transform-origin: center; animation: ccmc-spark 2.2s ease-in-out infinite; }
.button, .mode-switch, .logout-button, .text-link, .dark-link {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.button:active, .mode-switch:active, .logout-button:active, .text-link:active, .dark-link:active {
  transform: translateY(2px) scale(.97);
}
.button-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
.button-secondary:active { transform: translateY(1px) scale(.97); }
.mode-switch, .logout-button, .text-link, .dark-link { transition: color .18s ease, transform .18s ease, opacity .18s ease; }
#auth-form input { transition: border-color .18s ease, box-shadow .18s ease; }
#auth-form input:focus { box-shadow: 0 0 0 3px rgba(165,230,92,.14); }
.auth-submit[aria-busy="true"] { animation: ccmc-submit-pulse .85s ease-in-out infinite alternate; }
.page-main { animation: ccmc-fade-up .42s ease both; }
.template-card { transition: border-color .22s ease, box-shadow .22s ease, transform .22s ease; }
.template-card:hover { border-color: rgba(165,230,92,.5); box-shadow: 0 16px 34px rgba(0,0,0,.2); transform: translateY(-2px); }

@keyframes ccmc-fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ccmc-float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
@keyframes ccmc-orbit {
  0%,100% { transform: rotate(22deg) translateY(0); }
  50% { transform: rotate(25deg) translateY(-8px); }
}
@keyframes ccmc-spark {
  0%,100% { opacity: .72; transform: scale(1) rotate(0); }
  50% { opacity: 1; transform: scale(1.18) rotate(18deg); }
}
@keyframes ccmc-submit-pulse {
  from { filter: brightness(1); }
  to { filter: brightness(1.16); }
}


/* Minecraft-inspired movement and click feedback */
.auth-page {
  position: relative;
  isolation: isolate;
  background-size: 145% 145%;
  animation: ccmc-bg-shift 18s ease-in-out infinite alternate;
}
.auth-story, .auth-side { position: relative; z-index: 1; }
.auth-side { overflow: hidden; }
.auth-side::before {
  content: "";
  position: absolute;
  right: 4%;
  bottom: 8%;
  width: 180px;
  height: 180px;
  opacity: .12;
  pointer-events: none;
  background:
    linear-gradient(90deg, transparent 17px, var(--green) 17px 34px, transparent 34px),
    linear-gradient(transparent 17px, var(--sky) 17px 34px, transparent 34px);
  background-size: 52px 52px;
  mask-image: radial-gradient(circle, #000 0, transparent 72%);
  animation: ccmc-pixel-drift 9s ease-in-out infinite;
}
.auth-story::after {
  content: "";
  position: absolute;
  z-index: 0;
  top: 31%;
  left: 13%;
  width: 11px;
  height: 11px;
  opacity: .3;
  background: var(--green);
  box-shadow: 43px 71px var(--sky), 91px -24px var(--orange), 142px 109px var(--green);
  image-rendering: pixelated;
  animation: ccmc-pixel-drift 7s ease-in-out infinite reverse;
  pointer-events: none;
}
.auth-card {
  position: relative;
  z-index: 1;
  padding: clamp(22px, 3vw, 34px);
  border: 1px solid rgba(165,230,92,.2);
  border-radius: 4px;
  background: linear-gradient(145deg, rgba(29,42,29,.94), rgba(19,27,20,.93));
  box-shadow: 0 20px 60px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.035);
}
.brand-mark { animation: ccmc-logo-bob 5s ease-in-out infinite; }
.button {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.button::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  opacity: 0;
  background: rgba(255,255,255,.6);
  transform: translate(-50%,-50%) scale(0);
  pointer-events: none;
}
.button.ccmc-clicked::after { animation: ccmc-ripple .58s ease-out; }
.button-primary:hover {
  transform: translate(2px,2px) scale(1.015);
  box-shadow: 2px 2px 0 #527735, 0 0 24px rgba(165,230,92,.18);
}
.button:active, .mode-switch:active, .logout-button:active {
  transform: translateY(2px) scale(.97);
}
.auth-submit[aria-busy="true"] span {
  display: inline-block;
  animation: ccmc-arrow-spin .7s ease-in-out infinite;
}
.recent-row {
  transition: background .2s ease, padding .2s ease, border-color .2s ease;
}
.recent-row:hover {
  padding-left: 10px;
  padding-right: 10px;
  border-color: rgba(165,230,92,.4);
  background: rgba(165,230,92,.035);
}
.template-card:hover .cover-heading { color: var(--green); }

@keyframes ccmc-bg-shift {
  from { background-position: 0% 0%; }
  to { background-position: 100% 100%; }
}
@keyframes ccmc-pixel-drift {
  0%,100% { transform: translate3d(0,0,0) rotate(0); }
  50% { transform: translate3d(0,-14px,0) rotate(3deg); }
}
@keyframes ccmc-logo-bob {
  0%,100% { transform: rotate(-8deg) translateY(0); }
  50% { transform: rotate(-4deg) translateY(-3px); }
}
@keyframes ccmc-ripple {
  0% { opacity: .42; transform: translate(-50%,-50%) scale(0); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(18); }
}
@keyframes ccmc-arrow-spin {
  0%,100% { transform: translateX(0) rotate(0); }
  50% { transform: translateX(3px) rotate(12deg); }
}
@media (prefers-reduced-motion: reduce) {
  .auth-page, .auth-side::before, .auth-story::after, .brand-mark { animation: none !important; }
  .button::after { animation: none !important; }
}

  function renderDetail(template) {
    var details = [

  function renderInfo(kind) {

  function renderCookieSettings() {
    shell(
      '<section class="subpage section-wrap info-page cookie-page" aria-labelledby="cookie-title">' +
        '<p class="eyebrow"><span class="eyebrow-dot"></span> Preferências de sessão</p>' +
        '<h1 id="cookie-title">Cookies e sessão.</h1>' +
        '<p>A sessão normal termina quando fechas o navegador. Se escolheres “Manter sessão iniciada”, o servidor guarda um token aleatório protegido e lembra este dispositivo por até 30 dias. A palavra-passe nunca é guardada em texto simples.</p>' +
        '<p class="cookie-state" id="cookie-state" role="status"></p>' +
        '<p class="demo-notice-text">O cookie de sessão é HttpOnly e SameSite. A opção de 30 dias só deve ser usada num dispositivo de confiança.</p>' +
        '<button class="button button-secondary" id="forget-cookie" type="button">Terminar sessão e deixar de lembrar este dispositivo</button>' +
      '</section>',
      "",
      "Cookies"
    );
    var state = document.getElementById("cookie-state");
    if (state) state.textContent = currentUser ? "Sessão iniciada como " + currentUser.email + "." : "Não há uma sessão iniciada.";
    document.getElementById("forget-cookie").addEventListener("click", function () {
      apiRequest("logout", {}).then(function () {
        currentUser = null;
        isAuthenticated = false;
        authMode = "login";
        window.location.hash = "#/login";
      }).catch(function (error) {
        if (state) state.textContent = error.message;
      });
    });

  function initializeCoverVideos() {
    document.querySelectorAll("[data-cover-video]").forEach(function (video) {
      var fallback = video.parentElement.querySelector("[data-video-play]");
      var status = video.parentElement.querySelector("[data-video-status]");
      function showFallback(message) {
        if (fallback) fallback.hidden = false;
        if (status && message) status.textContent = message;
      }
      video.addEventListener("playing", function () {
        if (fallback) fallback.hidden = true;
        if (status) status.textContent = "A prévia está em loop e sem som. Abre o template para ouvir.";
      });
      video.addEventListener("error", function () {
        showFallback("A prévia MP4 não abriu neste navegador. O ficheiro original continua disponível para descarregar.");
      });
      if (fallback) {
        fallback.addEventListener("click", function () {
          video.muted = true;
          var attempt;
          try {
            attempt = video.play();
          } catch (error) {
            showFallback("Não foi possível iniciar esta prévia neste navegador.");
            return;
          }
          if (attempt && typeof attempt.catch === "function") {
            attempt.then(function () {
              fallback.hidden = true;
            }).catch(function () {
              showFallback("Não foi possível iniciar esta prévia neste navegador. Abre o template para tentar no leitor.");
            });
          }
        });
      }
      try {
        var playAttempt = video.play();
        if (playAttempt && typeof playAttempt.catch === "function") {
          playAttempt.catch(function () {
            showFallback("A reprodução automática não iniciou. Carrega no botão para tentar reproduzir.");
          });
        }
      } catch (error) {
        showFallback("A reprodução automática não iniciou. Carrega no botão para tentar reproduzir.");
      }
    });
  }

  function currentPath() {
    return window.location.hash.replace(/^#\/?/, "").split("?")[0];
  }

  function route() {
    var path = currentPath();
    if (!authReady) {
      renderLoading();
      return;
    }
    if (!isAuthenticated) {
      if (path !== "login") window.location.hash = "#/login";
      renderLogin();
      return;
    }
    if (!path || path === "login") {
      if (path !== "home") window.location.hash = "#/home";
      renderHome();
      return;
    }
    if (path === "home") {
      renderHome();
    } else if (path === "templates") {
      renderLibrary();
    } else if (path === "how") {
      renderHow();
    } else if (path === "about" || path === "contact" || path === "terms") {
      renderInfo(path);
    } else if (path === "cookies") {
      renderCookieSettings();
    } else if (path.indexOf("template/") === 0) {
      var id = path.split("/")[1];
      var template = getTemplate(id);
      if (template) renderDetail(template);
      else renderHome();
    } else {
      renderHome();
    }
  }

  document.addEventListener("click", function (event) {
    var target = event.target.closest ? event.target.closest(".button") : null;
    if (!target || target.disabled) return;
    target.classList.remove("ccmc-clicked");
    void target.offsetWidth;
    target.classList.add("ccmc-clicked");
    window.setTimeout(function () {
      target.classList.remove("ccmc-clicked");
    }, 650);
  });

  window.addEventListener("hashchange", route);
  initializeAuth();
}());
